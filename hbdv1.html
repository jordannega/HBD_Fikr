<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070B18" />
<meta name="description" content="A birthday universe for Fikr." />
<meta property="og:title" content="A Note for Fikr" />
<meta property="og:description" content="A birthday universe built just for you." />
<title>A Note for Fikr ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #05070F;
    --bg-1: #0A1124;
    --bg-2: #0F1A32;
    --fg: #F5F1E8;
    --fg-dim: rgba(245, 241, 232, 0.72);
    --fg-mute: rgba(245, 241, 232, 0.42);
    --primary: #F1B86A;
    --primary-2: #E89A4E;
    --accent: #FF7EB6;
    --accent-2: #7EE8FA;
    --violet: #A78BFA;
    --card: rgba(255, 255, 255, 0.035);
    --card-2: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.1);
    --border-hi: rgba(255, 255, 255, 0.2);
    --glass: rgba(15, 22, 42, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100%;
    background: var(--bg-0);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(241, 184, 106, 0.10), transparent 55%),
      radial-gradient(900px 700px at -10% 110%, rgba(167, 139, 250, 0.10), transparent 55%),
      radial-gradient(700px 500px at 50% 40%, rgba(255, 126, 182, 0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    position: relative;
    overflow-x: hidden;
  }

  #stars, #fx, #cursor {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }
  #fx { z-index: 2; }
  #cursor { z-index: 3; mix-blend-mode: screen; }

  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
    will-change: transform, opacity;
  }
  .orb-a {
    width: 340px; height: 340px;
    background: radial-gradient(circle, var(--primary), transparent 65%);
    top: -6%; right: -16%;
    opacity: 0.22;
    animation: float 14s ease-in-out infinite;
  }
  .orb-b {
    width: 380px; height: 380px;
    background: radial-gradient(circle, var(--violet), transparent 65%);
    bottom: -10%; left: -20%;
    opacity: 0.16;
    animation: float 18s ease-in-out infinite reverse;
  }
  .orb-c {
    width: 260px; height: 260px;
    background: radial-gradient(circle, var(--accent-2), transparent 65%);
    top: 40%; left: 60%;
    opacity: 0.08;
    animation: float 22s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate3d(0,0,0) scale(1); }
    50%      { transform: translate3d(30px,-40px,0) scale(1.08); }
  }

  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .app {
    position: relative;
    z-index: 4;
    min-height: 100vh;
    max-width: 520px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.4px;
    color: var(--fg-mute);
    text-transform: uppercase;
  }
  .brand-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--fg-dim);
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.2s ease;
  }
  .icon-btn:hover { border-color: var(--border-hi); color: var(--fg); transform: translateY(-1px); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn.playing {
    color: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 16px rgba(241,184,106,0.35);
    animation: musicPulse 1.6s ease-in-out infinite;
  }
  @keyframes musicPulse {
    0%,100% { box-shadow: 0 0 16px rgba(241,184,106,0.35); }
    50%     { box-shadow: 0 0 24px rgba(241,184,106,0.7); }
  }

  .progress-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    color: var(--fg-mute);
    font-variant-numeric: tabular-nums;
  }

  .stage-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 0 20px;
    animation: stageIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes stageIn {
    0%   { opacity: 0; transform: translateY(28px) scale(0.98); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .stage.leaving {
    animation: stageOut 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  @keyframes stageOut {
    to { opacity: 0; transform: translateY(-16px) scale(0.99); filter: blur(4px); }
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.6px;
    text-align: center;
    color: var(--primary);
    text-transform: uppercase;
    opacity: 0.95;
  }

  .hero-title {
    font-family: 'Fraunces', 'Inter', serif;
    font-size: clamp(30px, 9vw, 44px);
    line-height: 1.08;
    letter-spacing: -1.4px;
    font-weight: 600;
    text-align: center;
    margin-top: 18px;
    background: linear-gradient(180deg, #FFFCF5 0%, #F1B86A 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .hero-body {
    font-size: 15px;
    line-height: 24px;
    text-align: center;
    max-width: 320px;
    margin-top: 18px;
    color: var(--fg-dim);
  }

  .star-seal {
    width: 116px; height: 116px;
    border-radius: 50%;
    border: 1px solid var(--border-hi);
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.14), transparent 55%),
      var(--card-2);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    backdrop-filter: blur(14px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 20px 60px -20px rgba(241,184,106,0.4);
    animation: sealIn 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes sealIn {
    0% { transform: scale(0.7) rotate(-30deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .star-seal svg { color: var(--primary); filter: drop-shadow(0 0 12px rgba(241,184,106,0.6)); }
  .seal-ring {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px dashed rgba(241,184,106,0.5);
    animation: spin 22s linear infinite;
  }
  .seal-ring::after {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary);
    transform: translateX(-50%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 60px;
    padding: 0 26px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
    color: #1A1206;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.1px;
    cursor: pointer;
    margin-top: 34px;
    width: 100%;
    max-width: 360px;
    overflow: hidden;
    box-shadow:
      0 10px 30px -8px rgba(241,184,106,0.5),
      0 4px 12px -4px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s;
    isolation: isolate;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.6) 50%, transparent 70%);
    transform: translateX(-150%);
    transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }
  .btn:hover::before { transform: translateX(150%); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -8px rgba(241,184,106,0.65), 0 6px 16px -4px rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn span, .btn svg { position: relative; z-index: 2; }

  .hint {
    font-size: 12px;
    margin-top: 14px;
    color: var(--fg-mute);
  }

  .chapter-row {
    display: flex;
    align-items: center;
    align-self: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }
  .chapter-line {
    width: 26px; height: 2px; border-radius: 2px;
    background: var(--primary);
    box-shadow: 0 0 10px rgba(241,184,106,0.7);
  }

  .section-title {
    font-family: 'Fraunces', serif;
    width: 100%;
    font-size: clamp(26px, 7.5vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.9px;
    font-weight: 600;
    margin-bottom: 26px;
    color: var(--fg);
  }

  .letter-card {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 26px 24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    backdrop-filter: blur(20px);
    box-shadow:
      0 24px 60px -24px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .letter-card::before {
    content: '';
    position: absolute;
    top: -1px; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.6;
  }

  .letter-quote {
    font-family: 'Fraunces', serif;
    font-size: 56px;
    line-height: 0.7;
    font-weight: 800;
    color: var(--primary);
    height: 42px;
    opacity: 0.9;
  }

  .letter-text {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    line-height: 30px;
    letter-spacing: -0.4px;
    font-weight: 600;
    margin-top: 12px;
    color: var(--fg);
  }

  .card-rule {
    height: 1px;
    width: 100%;
    margin: 20px 0;
    background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
  }

  .card-body {
    font-size: 14px;
    line-height: 23px;
    color: var(--fg-dim);
  }

  .signature-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }
  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 4px 12px -2px rgba(255,126,182,0.5);
  }
  .signature {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--primary);
    text-transform: lowercase;
  }

  .timeline { width: 100%; margin-top: 4px; }
  .timeline-item { display: flex; min-height: 128px; opacity: 0; animation: itemIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .timeline-item:nth-child(1) { animation-delay: 0.05s; }
  .timeline-item:nth-child(2) { animation-delay: 0.2s; }
  .timeline-item:nth-child(3) { animation-delay: 0.35s; }
  @keyframes itemIn {
    0% { opacity: 0; transform: translateX(-14px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .timeline-rail { width: 28px; display: flex; flex-direction: column; align-items: center; }
  .timeline-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border-hi);
    background: var(--bg-1);
    margin-top: 4px;
    flex-shrink: 0;
    position: relative;
  }
  .timeline-dot.active {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(241,184,106,0.15), 0 0 16px rgba(241,184,106,0.6);
  }
  .timeline-dot.active::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid var(--primary);
    opacity: 0.4;
    animation: ping 2.4s ease-out infinite;
  }
  @keyframes ping {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .timeline-stem {
    width: 1px;
    flex: 1;
    margin: 6px 0;
    background: linear-gradient(180deg, var(--border-hi), transparent);
  }
  .timeline-copy { flex: 1; padding-left: 14px; padding-bottom: 20px; }
  .timeline-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .timeline-index { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--primary); }
  .timeline-label { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; color: var(--fg-mute); text-transform: uppercase; }
  .timeline-title { font-size: 18px; line-height: 24px; font-weight: 600; color: var(--fg); }
  .timeline-body { font-size: 13px; line-height: 20px; margin-top: 5px; color: var(--fg-dim); }

  .celebration-mark {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #FFF3D6, var(--primary) 60%, var(--primary-2));
    color: #1A1206;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 8px rgba(241,184,106,0.08),
      0 0 60px rgba(241,184,106,0.55),
      inset 0 -6px 12px rgba(0,0,0,0.12);
    animation: celebrate 2.4s ease-in-out infinite;
  }
  @keyframes celebrate {
    0%, 100% { transform: scale(1) rotate(0); }
    50%      { transform: scale(1.08) rotate(4deg); }
  }

  .final-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 9.5vw, 46px);
    line-height: 1.06;
    letter-spacing: -1.6px;
    font-weight: 600;
    text-align: center;
    margin-top: 18px;
    background: linear-gradient(180deg, #FFFCF5 0%, #F1B86A 110%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .final-body {
    font-size: 15px;
    line-height: 24px;
    text-align: center;
    max-width: 330px;
    margin-top: 18px;
    color: var(--fg-dim);
  }

  .stats-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-top: 34px;
    padding: 0 4px;
    gap: 8px;
  }
  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 6px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    backdrop-filter: blur(12px);
    transition: all 0.25s;
  }
  .stat:hover { border-color: rgba(241,184,106,0.4); transform: translateY(-2px); }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.6px;
    background: linear-gradient(180deg, #FFFCF5, var(--primary));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .stat-label { font-size: 10px; font-weight: 500; margin-top: 4px; text-align: center; color: var(--fg-mute); letter-spacing: 0.4px; }

  .final-note {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 12px;
    margin-top: 30px;
    background: linear-gradient(135deg, rgba(255,126,182,0.08), rgba(167,139,250,0.08));
    backdrop-filter: blur(12px);
  }
  .final-note svg { color: var(--accent); flex-shrink: 0; animation: heartbeat 1.6s ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(1); }
  }
  .final-note-text { font-size: 12.5px; font-weight: 600; color: var(--fg); }

  .replay-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 10px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--fg-mute);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .replay-btn:hover { color: var(--fg); border-color: var(--border-hi); transform: translateY(-1px); }
  .replay-btn:active { transform: scale(0.96); }

  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding-top: 26px;
  }
  .pip {
    height: 5px;
    border-radius: 5px;
    background: var(--border);
    width: 6px;
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s;
  }
  .pip.active { background: var(--primary); width: 28px; box-shadow: 0 0 12px rgba(241,184,106,0.6); }
  .pip.done { background: var(--primary); width: 6px; opacity: 0.55; }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translate(-50%, 140%);
    padding: 12px 20px;
    background: var(--glass);
    border: 1px solid var(--border-hi);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show { transform: translate(-50%, 0); }

  /* Hidden YouTube player — audio only, off-screen */
  #ytHost {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  @media (max-width: 380px) {
    .hero-title, .final-title { letter-spacing: -1px; }
    .app { padding-left: 18px; padding-right: 18px; }
    .stat-value { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<canvas id="cursor"></canvas>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>
<div class="noise"></div>

<!-- Hidden YouTube player (audio only) -->
<div id="ytHost"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      A NOTE FOR FIKR
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="musicBtn" title="Toggle music" aria-label="Toggle music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>

/* =====================================================================
   STARS + PARALLAX
   ===================================================================== */
const starsCanvas = document.getElementById('stars');
const sctx = starsCanvas.getContext('2d');
let stars = [];
let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

function initStars() {
  starsCanvas.width = window.innerWidth * devicePixelRatio;
  starsCanvas.height = window.innerHeight * devicePixelRatio;
  starsCanvas.style.width = window.innerWidth + 'px';
  starsCanvas.style.height = window.innerHeight + 'px';
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.scale(devicePixelRatio, devicePixelRatio);

  const count = Math.min(180, Math.floor(window.innerWidth * window.innerHeight / 7000));
  stars = [];
  for (let i = 0; i < count; i++) {
    const layer = Math.random();
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: layer * 1.4 + 0.2,
      baseA: layer * 0.7 + 0.15,
      twinkle: Math.random() * Math.PI * 2,
      speed: 0.005 + Math.random() * 0.012,
      parallax: layer * 0.6 + 0.1,
      hue: Math.random(),
      drift: (Math.random() - 0.5) * 0.05,
    });
  }
}

function drawStars() {
  sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;

  for (const s of stars) {
    s.twinkle += s.speed;
    s.y += s.drift;
    if (s.y > window.innerHeight + 5) s.y = -5;
    if (s.y < -5) s.y = window.innerHeight + 5;

    const a = s.baseA * (0.55 + Math.sin(s.twinkle) * 0.45);
    const px = s.x + mouseX * s.parallax * 30;
    const py = s.y + mouseY * s.parallax * 30;

    let color = '255, 255, 255';
    if (s.hue > 0.9) color = '241, 184, 106';
    else if (s.hue > 0.82) color = '167, 139, 250';
    else if (s.hue > 0.75) color = '126, 232, 250';

    sctx.beginPath();
    sctx.arc(px, py, s.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(${color}, ${a})`;
    sctx.fill();

    if (s.r > 1.1) {
      sctx.beginPath();
      sctx.arc(px, py, s.r * 3, 0, Math.PI * 2);
      sctx.fillStyle = `rgba(${color}, ${a * 0.08})`;
      sctx.fill();
    }
  }
  requestAnimationFrame(drawStars);
}

window.addEventListener('mousemove', e => {
  targetX = (e.clientX / window.innerWidth - 0.5) * 2;
  targetY = (e.clientY / window.innerHeight - 0.5) * 2;
});
window.addEventListener('deviceorientation', e => {
  if (e.gamma != null && e.beta != null) {
    targetX = Math.max(-1, Math.min(1, e.gamma / 45));
    targetY = Math.max(-1, Math.min(1, (e.beta - 45) / 45));

}, true);

/* =====================================================================
   PARTICLE FX
   ===================================================================== */
const fxCanvas = document.getElementById('fx');
const fctx = fxCanvas.getContext('2d');
let particles = [];
let shake = 0;

function resizeFx() {
  fxCanvas.width = window.innerWidth * devicePixelRatio;
  fxCanvas.height = window.innerHeight * devicePixelRatio;
  fxCanvas.style.width = window.innerWidth + 'px';
  fxCanvas.style.height = window.innerHeight + 'px';
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.scale(devicePixelRatio, devicePixelRatio);
}

function spawnConfetti(count = 80, originX = null, originY = null) {
  const colors = ['#F1B86A', '#FF7EB6', '#7EE8FA', '#A78BFA', '#FFFFFF', '#E89A4E'];
  for (let i = 0; i < count; i++) {
    const x = originX != null ? originX : Math.random() * window.innerWidth;
    const y = originY != null ? originY : -20;
    const angle = originY != null ? Math.random() * Math.PI * 2 : Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    const speed = originY != null ? Math.random() * 8 + 2 : Math.random() * 3 + 1.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (originY != null ? 0 : 1),
      life: 1,
      decay: 0.006 + Math.random() * 0.008,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      gravity: 0.12,
    });
  }
}

function spawnFirework(x, y) {
  const colors = ['#F1B86A', '#FF7EB6', '#7EE8FA', '#A78BFA', '#FFFFFF'];
  const hue = colors[Math.floor(Math.random() * colors.length)];
  const count = 60 + Math.floor(Math.random() * 40);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.2;
    const speed = Math.random() * 6 + 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.012 + Math.random() * 0.01,
      size: Math.random() * 3 + 1.5,
      color: hue,
      rot: 0, vr: 0,
      shape: 'circle',
      gravity: 0.06,
      glow: true,
    });
  }
  shake = Math.min(8, shake + 3);
  if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
}

function updateFx() {
  fctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  if (shake > 0.1) {
    fctx.save();
    fctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.9;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.rot += p.vr;
    p.life -= p.decay;

    if (p.life <= 0 || p.y > window.innerHeight + 50) {
      particles.splice(i, 1);
      continue;
    }

    fctx.save();
    fctx.globalAlpha = Math.max(0, p.life);
    if (p.glow) {
      fctx.shadowBlur = 14;
      fctx.shadowColor = p.color;
    }
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      fctx.beginPath();
      fctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      fctx.fill();
    }
    fctx.restore();
  }

  if (shake > 0.1) fctx.restore();
  requestAnimationFrame(updateFx);
}

let fireworkInterval = null;
function startFireworks() {
  stopFireworks();
  const launch = () => {
    const x = Math.random() * window.innerWidth;
    const y = window.innerHeight * (0.2 + Math.random() * 0.4);

function addTrail(x, y) {
  trail.push({ x, y, life: 1, size: 3 + Math.random() * 2 });

}

function drawTrail() {
  cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (let i = trail.length - 1; i >= 0; i--) {
    const t = trail[i];
    t.life -= 0.035;
    if (t.life <= 0) { trail.splice(i, 1); continue; }
    cctx.beginPath();
    cctx.arc(t.x, t.y, t.size * t.life, 0, Math.PI * 2);
    cctx.fillStyle = `rgba(241, 184, 106, ${t.life * 0.45})`;
    cctx.shadowBlur = 12;
    cctx.shadowColor = '#F1B86A';
    cctx.fill();
  }
  requestAnimationFrame(drawTrail);
}

/* =====================================================================
   SFX — button "ding" (synthesized, no external file)
   ===================================================================== */
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// A warm, glassy "ding" — two-osc bell + soft lowpass
function playButtonDing(pitch = 880) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // Fundamental
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(pitch, now);
  osc1.frequency.exponentialRampToValueAtTime(pitch * 0.998, now + 0.35);

  // Harmonic
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(pitch * 2.76, now); // bell partial

  // Sub for warmth
  const osc3 = audioCtx.createOscillator();
  osc3.type = 'triangle';
  osc3.frequency.setValueAtTime(pitch / 2, now);

  const g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(0, now);
  g1.gain.linearRampToValueAtTime(0.18, now + 0.005);
  g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0, now);
  g2.gain.linearRampToValueAtTime(0.05, now + 0.004);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

  const g3 = audioCtx.createGain();
  g3.gain.setValueAtTime(0, now);
  g3.gain.linearRampToValueAtTime(0.06, now + 0.006);
  g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

  // Soft lowpass for a "pluck" character
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(4200, now);
  lp.frequency.exponentialRampToValueAtTime(1400, now + 0.4);
  lp.Q.value = 0.6;

  osc1.connect(g1).connect(lp);
  osc2.connect(g2).connect(lp);
  osc3.connect(g3).connect(lp);
  lp.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc3.start(now);
  osc1.stop(now + 0.6);
  osc2.stop(now + 0.3);
  osc3.stop(now + 0.45);
}

   ===================================================================== */
function boot() {
  initStars();
  resizeFx();
  resizeCursor();
  drawStars();
  updateFx();
  drawTrail();

  // First user gesture → unlock audio + start YouTube music
  const unlock = () => {
    ensureAudio();
    unlockAndStartMusic();
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
    document.removeEventListener('touchstart', unlock);
  };
  document.addEventListener('pointerdown', unlock, { once: true });
  document.addEventListener('keydown', unlock, { once: true });
  document.addEventListener('touchstart', unlock, { once: true, passive: true });

  render();
}

window.addEventListener('resize', () => {
  initStars();
  resizeFx();
  resizeCursor();
});

boot();
</script>
